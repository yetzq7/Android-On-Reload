<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <style>
    :root {
      --background-image: url("https://i.ibb.co/k2Lhc3G6/PWXxg-E.jpg");
      --background-blur: 5px;
      --background-darkness: 0.35;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
      position: relative;
      background-color: #121212;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -40px;
      background-image: var(--background-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(var(--background-blur));
      transform: scale(1.05);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, var(--background-darkness));
      z-index: -1;
    }

    .container {
      background-color: rgba(31, 31, 31, 0.92);
      padding: 35px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin: 0 0 8px;
      font-weight: 600;
      font-size: 24px;
      color: #fff;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #999;
      font-size: 14px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      background-color: #2a2a2a;
      color: #fff;
      outline: none;
    }

    input:focus {
      outline: 2px solid #73eaff;
    }

    button {
      width: 100%;
      padding: 12px 0;
      border: none;
      border-radius: 8px;
      background-color: hsl(0, 0%, 0%);
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover {
      background-color: #070707;
    }

    button:active {
      background-color: #000000;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      color: #aaa;
      margin-top: 14px;
      font-size: 14px;
      display: none;
    }

    #error {
      color: #ff5555;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }

    #retry {
      margin-top: 10px;
      background: #333;
      display: none;
    }

    #retry:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Welcome!</h1>

    <p class="subtitle">
      Enter your code to login.<br>
      (Use /mobile or /exchange-code)
    </p>

    <form id="loginForm">

      <input
        type="text"
        id="exchangeCode"
        placeholder="Code"
        autocomplete="off"
        spellcheck="false"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

      <div id="status"></div>

      <div id="error"></div>

      <button type="button" id="retry">
        Try Again
      </button>

    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const input = document.getElementById("exchangeCode");
    const button = document.getElementById("loginButton");
    const status = document.getElementById("status");
    const error = document.getElementById("error");
    const retry = document.getElementById("retry");

    function showStatus(message) {
      status.textContent = message;
      status.style.display = "block";
    }

    function showError(message) {
      error.textContent = message;
      error.style.display = "block";
    }

    function clearMessages() {
      status.textContent = "";
      status.style.display = "none";

      error.textContent = "";
      error.style.display = "none";

      retry.style.display = "none";
    }

    function openFortnite(code) {
      const uri = "com.epicgames.fortnite://authorize/?code=" + encodeURIComponent(code);

      console.log("uri - ", uri);
      showStatus("Redirecting you back..");
      const iframe = document.createElement("iframe");

      iframe.style.display = "none";
      iframe.src = uri;

      document.body.appendChild(iframe);

      /*
       * fallback
       * discovered its needed if it dosent redirect to fn after a few
       * this is just incase
       */
      setTimeout(() => {
        document.body.removeChild(iframe);

        showError(
          "app did not open!"
        );

        retry.style.display = "block";

        button.disabled = false;
        button.textContent = "Login";
      }, 4000);
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      clearMessages();

      const exchangeCode = input.value.trim();

      if (!exchangeCode) {
        showError("Code is required!");
        return;
      }

      button.disabled = true;
      button.textContent = "opening..";

      openFortnite(exchangeCode);
    });

    retry.addEventListener("click", function() {
      clearMessages();

      const exchangeCode = input.value.trim();

      if (!exchangeCode) {
        showError("Code is required.");
        return;
      }

      button.disabled = true;
      button.textContent = "opening..";

      openFortnite(exchangeCode);
    });
  </script>

</body>
</html>
